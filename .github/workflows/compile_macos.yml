
on:
  workflow_call:

jobs:
  compile_macos:
    name: Build macOS ${{ matrix.arch }} Binaries
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake_arch: x86_64
            rid: osx-x64
          - arch: arm64
            cmake_arch: arm64
            rid: osx-arm64

    steps:
      - uses: actions/checkout@v7

      - name: Configure CMake
        run: |
          cmake -DCMAKE_OSX_SYSROOT=macosx -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }} -DCMAKE_HOST_SYSTEM_PROCESSOR=${{ matrix.cmake_arch }} -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.cmake_arch }} -DCMAKE_SYSTEM_NAME=macOS -DCMAKE_HOST_SYSTEM_NAME=macOS -DCMAKE_BUILD_TYPE=Release -DDynamicBinaryInstrument=OFF -DPlugin.SymbolResolver=OFF -B build/${{ matrix.rid }}

      - name: Build
        run: |
          cmake --build build/${{ matrix.rid }} --target dobby --parallel

      - name: Verify Architecture
        run: |
          lipo -info build/${{ matrix.rid }}/libdobby.a
          lipo -verify_arch ${{ matrix.cmake_arch }} build/${{ matrix.rid }}/libdobby.a

      - name: Rename Artifact
        run: |
          mv build/${{ matrix.rid }}/libdobby.a build/${{ matrix.rid }}/libdobby_${{ matrix.arch }}.a

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: MacOS.${{ matrix.arch }}
          path: build/${{ matrix.rid }}/libdobby_${{ matrix.arch }}.a
